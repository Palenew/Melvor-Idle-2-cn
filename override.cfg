; Melvor Idle 2 - 挂载游戏包内已存在的官方简体中文 (Locale/zh_CN.po)
; 用法：把本文件放到 Melvor2.exe 同一目录（Steam\steamapps\common\Melvor Idle 2\）
;       完全退出游戏后，从 Steam 启动，在 设置 -> 语言 里选择简体中文。
;       删除本文件即可完全还原，不修改 exe / 存档 / 任何游戏文件。
;
; 原理：override.cfg 是 Godot 官方的导出项目设置覆盖机制，
;       引擎读取 res://override.cfg（= 可执行文件同目录）。
;       数组里保留 en_GB.po 再追加包内已有的 zh_CN.po，
;       TranslationServer 会登记 zh_CN 这个 locale，
;       游戏 C# 的 GetLoadedLocales / PopulateLanguageOptions 据此生成语言菜单项。
;
; 注意：zh_CN.po 是包内文件，繁体方案用的 res://Locale/en_GB.po 同样是包内文件，
;       已证明该路径形式可被解析，无需解包、无需额外 mod 文件夹。

[internationalization]

locale/translations=PackedStringArray("res://Locale/en_GB.po", "res://Locale/zh_CN.po")
